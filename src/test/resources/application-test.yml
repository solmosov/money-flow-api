spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: *
  export:
    dir: ${java.io.tmpdir}/moneyflow-test-exports
    link-secret: test-secret-test-secret-test-secret-test-secret
  telegram:
    webhook-secret: webhook-secret
    bot-token: test-bot-token
  security:
    jwt:
      secret-key: test-only-secret-key-for-context-load-test-0123456789
      access-token-expiration: 86400000
      refresh-token-expiration: 604800000