spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/money_flow_db
    username: admin
    password: secret
    driver-class-name: org.postgresql.Driver

app:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-expiration: 86400000
      refresh-token-expiration: 604800000

logging:
  level:
    com.example.moneyflowapi.handler: DEBUG
    org.flywaydb: DEBUG