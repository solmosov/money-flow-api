spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/money_flow_db
    username: admin
    password: secret
    driver-class-name: org.postgresql.Driver

app:
  app:
    cors:
      allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  export:
    dir: ./exports
    link-secret: ${APP_EXPORT_LINK_SECRET:dev-only-secret-change-me-0123456789abcdef}
  telegram:
    webhook-secret: ${TELEGRAM_BOT_WEBHOOK_SECRET}
    bot-token: ${TELEGRAM_BOT_TOKEN}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-expiration: 86400000
      refresh-token-expiration: 604800000

logging:
  level:
    com.example.moneyflowapi.handler: DEBUG
    org.flywaydb: DEBUG