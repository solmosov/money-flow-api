spring:
  profiles:
    default: dev
  application:
    name: money-flow-api
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  export:
    ttl-hours: 24

server:
  port: ${SERVER_PORT:8080}