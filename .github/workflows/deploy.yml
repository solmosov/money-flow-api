name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: money-flow-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR
        id: build
        run: |
          chmod +x mvnw
          ./mvnw -B clean package

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload JAR
        id: upload
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            target/app.jar \
            "$VPS_USER@$VPS_HOST:/opt/moneyflow/incoming/app.jar"

      - name: Deploy
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/money-flow-deploy"

      - name: Notify Slack (success)
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOYS }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WEBHOOK=$(printf '%s' "$SLACK_WEBHOOK" | tr -d '[:space:]')
          TITLE=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          TIME=$(TZ=Asia/Tashkent date '+%Y-%m-%d %H:%M:%S')
          PAYLOAD=$(jq -n \
            --arg commit "${SHA:0:7}" \
            --arg msg "$TITLE" \
            --arg actor "$ACTOR" \
            --arg url "$RUN_URL" \
            --arg ctx "$TIME Tashkent · GitHub Actions" '
          {
            text: ("🟢 DEPLOY OK " + $commit),
            attachments: [{
              color: "#2EB67D",
              blocks: [
                {type:"header", text:{type:"plain_text", text:"🟢 DEPLOY OK"}},
                {type:"section", fields:[
                  {type:"mrkdwn", text:("*Commit*\n" + $commit)},
                  {type:"mrkdwn", text:("*Author*\n" + $actor)},
                  {type:"mrkdwn", text:("*Message*\n" + $msg)},
                  {type:"mrkdwn", text:"*Health*\nchecked by deploy script"}
                ]},
                {type:"section", text:{type:"mrkdwn", text:("<" + $url + "|View run>")}},
                {type:"context", elements:[{type:"mrkdwn", text:$ctx}]}
              ]
            }]
          }')
          curl -fsS --max-time 10 -o /dev/null -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$WEBHOOK"

      - name: Notify Slack (failure)
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOYS }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          WEBHOOK=$(printf '%s' "$SLACK_WEBHOOK" | tr -d '[:space:]')
          TITLE=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          TIME=$(TZ=Asia/Tashkent date '+%Y-%m-%d %H:%M:%S')
          STEP="Checkout / setup"
          [ "$BUILD_OUTCOME" = "failure" ] && STEP="Build JAR (tests)"
          [ "$UPLOAD_OUTCOME" = "failure" ] && STEP="Upload JAR"
          [ "$DEPLOY_OUTCOME" = "failure" ] && STEP="Deploy"
          PAYLOAD=$(jq -n \
            --arg commit "${SHA:0:7}" \
            --arg msg "$TITLE" \
            --arg actor "$ACTOR" \
            --arg step "$STEP" \
            --arg url "$RUN_URL" \
            --arg ctx "$TIME Tashkent · GitHub Actions" '
          {
            text: ("❌ DEPLOY FAILED " + $commit + " at " + $step),
            attachments: [{
              color: "#E01E5A",
              blocks: [
                {type:"header", text:{type:"plain_text", text:"❌ DEPLOY FAILED"}},
                {type:"section", fields:[
                  {type:"mrkdwn", text:("*Commit*\n" + $commit)},
                  {type:"mrkdwn", text:("*Author*\n" + $actor)},
                  {type:"mrkdwn", text:("*Step*\n" + $step)},
                  {type:"mrkdwn", text:("*Message*\n" + $msg)}
                ]},
                {type:"section", text:{type:"mrkdwn", text:("<" + $url + "|View run>")}},
                {type:"context", elements:[{type:"mrkdwn", text:$ctx}]}
              ]
            }]
          }')
          curl -fsS --max-time 10 -o /dev/null -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$WEBHOOK"