services:
  postgres:
    container_name: "money_flow_db"
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres 
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - money-flow-app-net
    cpus: 0.75
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    container_name: money_flow_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: ${SERVER_PORT}

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
      APP_EXPORT_DIR: /var/app/exports
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1536m -XX:ActiveProcessorCount=2"
    volumes:
      - ./exports:/var/app/exports
    ports:
      - "8085"
    networks:
      - money-flow-app-net
    cpus: 1.0
    mem_limit: 2g

  nginx:
    container_name: money_flow_nginx
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./exports:/var/app/exports:ro
    networks:
      - money-flow-app-net
    cpus: 0.25
    mem_limit: 128m

volumes:
  postgres_data:
    driver: local

networks:
  money-flow-app-net:
    driver: bridge

