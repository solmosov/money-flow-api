services:
  postgres:
    container_name: "pizza_db"
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "secret"
      POSTGRES_DB: "money_flow_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pizza-delivery-app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pizza_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  postgres_data:
    driver: local

networks:
  pizza-delivery-app-net:
    driver: bridge

